name: CI Pipeline

on:
  push:
    branches: [ main, 'phase*-wip', 'codex/*' ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    name: Code Quality & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, zip, gd

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint (Code Style Check)
        run: ./vendor/bin/pint --test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

  test-sqlite:
    name: Test Suite (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, zip, gd

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit (SQLite)
        run: php artisan test --configuration=phpunit.xml

  test-postgresql:
    name: Test Suite (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexuscrm_test
          POSTGRES_USER: nexuscrm_test
          POSTGRES_PASSWORD: nexuscrm_test_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_pgsql, zip, gd

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit (PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nexuscrm_test
          DB_USERNAME: nexuscrm_test
          DB_PASSWORD: nexuscrm_test_secret
        run: php artisan test --configuration=phpunit.pgsql.xml
